name: PRISMA Core Link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  link-core:
    if: "!contains(github.event.head_commit.message, 'PRISMA Core Link')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link core script
        run: |
          grep -q 'prisma-core-fix.js' index.html || sed -i 's#</body>#<script src="prisma-core-fix.js"></script></body>#' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "PRISMA Core Link"
          git push