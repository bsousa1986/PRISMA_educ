name: PRISMA student assessment layer
on:
  push:
    branches: [main]
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject assessment script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          tag='<script src="prisma-exercises.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit injection
        run: |
          git config user.name "PRISMA Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: link PRISMA exercises and assessment layer"
          git push
