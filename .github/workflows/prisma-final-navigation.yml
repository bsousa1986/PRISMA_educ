name: PRISMA final navigation
on:
  push:
    branches: [main]
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html"); s=p.read_text()
          tag='<script src="prisma-final-navigation.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>'); p.write_text(s)
          PY
      - run: |
          git config user.name "PRISMA Bot"; git config user.email "actions@github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: activate final navigation authority"
            git push
          else
            echo "Final navigation already linked; nothing to commit."
          fi
