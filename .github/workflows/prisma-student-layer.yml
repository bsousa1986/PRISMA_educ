name: PRISMA Student Layer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  link:
    if: "!contains(github.event.head_commit.message, 'PRISMA Student Layer')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q 'prisma-student-sheets.js' index.html || sed -i 's#</body>#<script src="prisma-student-sheets.js"></script></body>#' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "PRISMA Student Layer"
          git push